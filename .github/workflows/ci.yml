name: MeshPay CI

on:
  push:
    branches-ignore: [main] # main is verified by CD through workflow_call.
    tags-ignore: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker for PostgreSQL and Redis Testcontainers
        run: docker info
      - name: Validate delivery workflows and scripts
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f -color
          docker run --rm -v "$PWD:/repo:ro" -w /repo koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d deploy/deploy.sh deploy/remote-deploy.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Run unit and integration tests
        run: ./mvnw test
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
