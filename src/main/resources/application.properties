# Server
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}

# Local development uses PostgreSQL; production activates postgres explicitly.
spring.profiles.default=dev
spring.jpa.show-sql=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Container readiness includes both persistence dependencies; expose no diagnostics.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
server.shutdown=graceful

# Idempotency window (how long a packet hash is remembered)
spring.data.redis.host=localhost
spring.data.redis.port=6379
upi.mesh.processing-lease-seconds=90
upi.mesh.replay-retention-seconds=86400

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400

# Packet validation bounds
mesh.max-ttl=10
mesh.max-hop-count=10
mesh.max-payload-size=16384

# Bound MVC JSON and servlet parsing; multipart uploads are unused.
mesh.max-request-bytes=32768
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
spring.servlet.multipart.enabled=false
mesh.max-packets-per-device=256
