<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MeshPay simulated offline mesh payment dashboard and demo ledger." />
    <meta name="theme-color" content="#060606" />
    <link rel="icon" href="/favicon.svg" th:href="@{/favicon.svg}" type="image/svg+xml" />
    <title>Dashboard | MeshPay</title>
    <link rel="stylesheet" href="/css/base/01-dashboard.css" th:href="@{/css/base/01-dashboard.css}" />
    <link rel="stylesheet" href="/css/layout/02-dashboard.css" th:href="@{/css/layout/02-dashboard.css}" />
    <link rel="stylesheet" href="/css/components/03-dashboard.css" th:href="@{/css/components/03-dashboard.css}" />
    <link rel="stylesheet" href="/css/components/04-dashboard.css" th:href="@{/css/components/04-dashboard.css}" />
    <link rel="stylesheet" href="/css/components/05-dashboard.css" th:href="@{/css/components/05-dashboard.css}" />
    <link rel="stylesheet" href="/css/components/06-dashboard.css" th:href="@{/css/components/06-dashboard.css}" />
    <link rel="stylesheet" href="/css/responsive/07-dashboard.css" th:href="@{/css/responsive/07-dashboard.css}" />
    <script
      defer
      src="/vendor/lucide.min.js"
      th:src="@{/vendor/lucide.min.js}"
    ></script>
    <script type="module" src="/js/main.js" th:src="@{/js/main.js}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to dashboard</a>
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
    <button
      class="drawer-backdrop"
      id="drawer-backdrop"
      aria-label="Close navigation"
      hidden
    ></button>
    <div class="page">
      <th:block th:replace="~{fragments/topbar :: topbar}"></th:block>
      <main id="main">
        <th:block th:replace="~{fragments/overview :: overview}"></th:block>
        <div
          id="notice"
          class="notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <th:block th:replace="~{fragments/analytics :: analytics}"></th:block>
        
        <section class="operations-grid">
          <th:block th:replace="~{fragments/payment-form :: payment-form}"></th:block>
          <th:block th:replace="~{fragments/mesh :: mesh}"></th:block>
        </section>
        <th:block th:replace="~{fragments/tables :: tables}"></th:block>
        
        
        
      </main>
    </div>
    <th:block th:replace="~{fragments/dialogs :: dialogs}"></th:block>
    
  </body>
</html>
