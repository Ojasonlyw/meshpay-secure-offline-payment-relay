<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="topbar">
<header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button menu-toggle"
            id="menu-toggle"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <i data-lucide="menu"></i>
          </button>
          <span>Dashboard</span><span class="slash">/</span
          ><strong>Home</strong>
        </div>
        <label class="command-search">
          <i data-lucide="search"></i>
          <input id="command-search" type="search" placeholder="Search records; press Enter" aria-label="Search dashboard" />
          <span>Ctrl</span><kbd>K</kbd>
        </label>
        <div class="topbar-right">

          <button class="icon-button" id="notifications-button" type="button" aria-label="Security notifications">
            <i data-lucide="bell"></i>
          </button>

          <span class="connection" id="connection" role="status"
            ><span class="live-dot"></span
            ><span id="connection-text">Connecting</span></span
          >
          <span class="avatar" aria-label="MeshPay demo workspace">MP</span>
        </div>
      </header>
</th:block>
