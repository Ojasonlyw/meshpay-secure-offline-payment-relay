name: meshpay-frontend
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshpay_frontend
      POSTGRES_USER: meshpay_frontend
      POSTGRES_PASSWORD: meshpay_frontend
    healthcheck:
      test: [CMD-SHELL, pg_isready -U meshpay_frontend -d meshpay_frontend]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [frontend-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /workspace
    command: [bash, ./mvnw, -DskipTests, spring-boot:run]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/meshpay_frontend
      DB_USERNAME: meshpay_frontend
      DB_PASSWORD: meshpay_frontend
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_THYMELEAF_CACHE: "false"
      SPRING_THYMELEAF_PREFIX: file:/workspace/src/main/resources/templates/
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/workspace/src/main/resources/static/
      UPI_MESH_DEMO_KEY_DIR: /demo-keys
    ports: ["127.0.0.1:18080:8080"]
    networks:
      default:
        aliases: [meshpay.local]
    volumes: ["..:/workspace", "frontend-maven:/root/.m2", "frontend-keys:/demo-keys"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  tools:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/frontend-tools
    init: true
    ipc: host
    environment:
      BASE_URL: http://meshpay.local:8080
    volumes: ["..:/workspace", "frontend-node:/workspace/frontend-tools/node_modules"]
    profiles: [tools]
volumes:
  frontend-postgres:
  frontend-maven:
  frontend-keys:
  frontend-node:
